<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a4480" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Lumen helps high school STEM teachers write culturally responsive, accessible, differentiated lesson plans, activities, assessments, and feedback."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Lumen · Culturally Responsive STEM Teaching</title>
    <script>
      (function () {
        try {
          var k = "lumen-theme";
          var t = localStorage.getItem(k);
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
            return;
          }
          document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
